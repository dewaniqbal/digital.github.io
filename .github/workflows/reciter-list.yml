name: reciter-list
on:
  push:
    branches: [claude/blissful-albattani-6lnmh8]
    paths: ['.github/workflows/reciter-list.yml']
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Print mp3quran.net reciters (id, name, riwaya, surah count)
        run: |
          curl -fsSL -A "Mozilla/5.0" "https://www.mp3quran.net/api/v3/reciters?language=eng" -o r.json; head -c 200 r.json; echo
          python3 - <<'PY'
          import json
          d=json.load(open('r.json'))['reciters']
          print("TOTAL", len(d))
          for r in d:
              m=r.get('moshaf') or []
              best=max(m,key=lambda x:x.get('surah_total',0),default={})
              print(f"{r['id']}|{r['name']}|{best.get('surah_total',0)}")
          PY
