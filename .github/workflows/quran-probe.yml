name: quran-probe
on:
  push:
    branches: [claude/quran-audio-android-app-jogbp4]
    paths: ['.github/workflows/quran-probe.yml', '.github/scripts/probe.py']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/probe.py
