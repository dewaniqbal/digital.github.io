# Static audit of the shipped (R8-minified) release APK with REA (Reverse Engineer Anything)
# + JADX. Answers: what does the APK declare, and did R8 keep the classes the app needs at runtime?
name: quran-apk-audit
on:
  workflow_dispatch:
  push:
    branches: [claude/quran-audio-android-app-jogbp4]
    paths: ['.github/workflows/quran-apk-audit.yml', '.github/scripts/apk_audit.py', 'quran-audio-app/app/proguard-rules.pro']
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quran-audio-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - uses: gradle/actions/setup-gradle@v5
      - name: Build release APK (minified)
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Fetch pinned JADX headless engine
        run: |
          mkdir -p "$RUNNER_TEMP/jadx" && cd "$RUNNER_TEMP/jadx"
          curl -fsSL -o jadx.jar https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar
          echo '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  jadx.jar' | sha256sum -c -
          echo "REA_JADX_MCP_JAR=$PWD/jadx.jar" >> "$GITHUB_ENV"
      - name: REA analysis
        env:
          REA_JADX_OPERATION_TIMEOUT_MS: '600000'
        run: |
          APK="$PWD/$(ls app/build/outputs/apk/release/*.apk | head -1)"
          OUT="$RUNNER_TEMP/rea"; mkdir -p "$OUT"
          npx -y rea-agents@latest --version || true
          npx -y rea-agents@latest inspect-android-package "$APK" --json > "$OUT/package.json" 2> "$OUT/package.err" || { echo "package inspection failed"; tail -50 "$OUT/package.err"; }
          for q in PlaybackService MainActivity QuranAudioApp Catalog LastSession serializer Mp3Quran RecitersResponse CatalogApi Mp3QuranDirectApi; do
            npx -y rea-agents@latest search-android-classes "$APK" "$q" --json > "$OUT/search_$q.json" 2> "$OUT/search_$q.err" || tail -20 "$OUT/search_$q.err"
          done
          python3 ../.github/scripts/apk_audit.py "$OUT" "$APK"
      - name: R8 keep check (dexdump, authoritative class list)
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          DEXDUMP="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)dexdump"
          mkdir -p "$RUNNER_TEMP/dex" && unzip -o -q "$APK" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          for d in "$RUNNER_TEMP"/dex/*.dex; do "$DEXDUMP" "$d"; done | grep -E "Class descriptor.*Lapp/quranaudio/" | sort -u > "$RUNNER_TEMP/rea/dex_classes.txt"
          # Classes reached only by reflection must survive R8 with their names (fails the job otherwise).
          missing=0
          for c in shared/source/Mp3QuranRecitersResponse\$\$serializer shared/catalog/Catalog\$\$serializer \
                   data/network/Mp3QuranDirectApi data/network/BackendCatalogApi playback/PlaybackService playback/LastSession\$\$serializer; do
            if grep -qF "Lapp/quranaudio/$c;" "$RUNNER_TEMP/rea/dex_classes.txt"; then echo "kept: $c"; else echo "MISSING: $c"; missing=1; fi
          done
          exit $missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-apk-audit
          path: ${{ runner.temp }}/rea/
