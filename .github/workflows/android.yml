name: Android CI

on:
  push:
    branches: [claude/**]
    paths: ["quran-audio/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quran-audio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDevDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: quran-audio-dev-debug-apk
          path: quran-audio/app/build/outputs/apk/dev/debug/*.apk
