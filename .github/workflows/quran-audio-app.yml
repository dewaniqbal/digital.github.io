name: quran-audio-app
on:
  push:
    branches: [claude/quran-audio-android-app-jogbp4]
    paths: ['quran-audio-app/**', '.github/workflows/quran-audio-app.yml']
  pull_request:
    paths: ['quran-audio-app/**', '.github/workflows/quran-audio-app.yml']
  workflow_dispatch:

concurrency:
  group: quran-audio-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: quran-audio-app

jobs:
  shared-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v5
      - name: Shared module tests
        run: ./gradlew -p shared test --console=plain
      - name: Backend tests + fat jar
        run: ./gradlew -p backend test buildFatJar --console=plain

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble debug + unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain --continue
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: quran-audio-app/app/build/reports/tests/
