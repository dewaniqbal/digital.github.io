name: quran-audio-app
on:
  push:
    branches: [claude/quran-audio-android-app-jogbp4]
    paths: ['quran-audio-app/**', '.github/workflows/quran-audio-app.yml']
  pull_request:
    paths: ['quran-audio-app/**', '.github/workflows/quran-audio-app.yml']
  workflow_dispatch:

concurrency:
  group: quran-audio-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: quran-audio-app

jobs:
  shared-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v5
      - name: Shared module tests
        run: ./gradlew -p shared test --console=plain
      - name: Backend tests + fat jar
        run: ./gradlew -p backend test buildFatJar --console=plain

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble debug + unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain --continue
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Release build (R8 minified, unsigned)
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Verify no secrets in release APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if unzip -p "$apk" 'classes*.dex' | strings | grep -iE 'client_secret|BEGIN (RSA )?PRIVATE KEY'; then echo "Secret-like string found"; exit 1; fi
          ls -la app/build/outputs/apk/release/
      - name: Build summary
        run: |
          python3 - <<'PY'
          import glob, re
          t=f=e=sk=0
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              h=open(x).read(2000); m=re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"',h)
              t+=int(m[1]); sk+=int(m[2]); f+=int(m[3]); e+=int(m[4]); print(x.split('/')[-1], m.group(0))
          print(f"APP UNIT TESTS: {t} run, {f} failures, {e} errors, {sk} skipped")
          PY
          ls -la app/build/outputs/apk/release/ app/build/outputs/apk/debug/
          grep -c '<issue' app/build/reports/lint-results-debug.xml || true
          echo "ROOM_SCHEMA_BEGIN"; cat app/schemas/app.quranaudio.data.db.AppDatabase/1.json; echo; echo "ROOM_SCHEMA_END"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-audio-debug-apk
          path: quran-audio-app/app/build/outputs/apk/debug/*.apk
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            quran-audio-app/app/build/reports/tests/
            quran-audio-app/app/build/reports/lint-results-debug.html
